<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Clínica de la Convergencia - Taller 1</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #000000; color: #00ffff; font-family: 'Courier New', Courier, monospace; padding: 20px; display: flex; justify-content: center; }
        .container { border: 2px solid #00ffff; padding: 30px; max-width: 600px; width: 100%; border-radius: 10px; box-shadow: 0 0 15px #00ffff; }
        h1 { color: #00ffff; text-align: center; border-bottom: 1px solid #00ffff; padding-bottom: 10px; }
        .option { display: block; margin: 10px 0; padding: 10px; border: 1px solid #00ffff; cursor: pointer; }
        .option:hover { background: #00ffff; color: #000000; }
        #feedback { margin-top: 20px; padding: 15px; border: 2px solid #00ffff; display: none; font-weight: bold; }
        .correct { color: #00ff00; border-color: #00ff00; }
        .incorrect { color: #ff0000; border-color: #ff0000; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Análisis de Caso: M.</h1>
    <div id="quiz-container"></div>
    <div id="feedback"></div>
    <button id="next-btn" style="display:none; width: 100%; padding: 10px; background: #00ffff; border: none; margin-top: 15px; cursor: pointer;" onclick="nextQuestion()">Siguiente Actividad</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD47_2UtWLFI_VRVvvXVAqn4zZzZ4d1ggo",
        authDomain: "av-clinica-convergencia.firebaseapp.com",
        databaseURL: "https://av-clinica-convergencia-default-rtdb.firebaseio.com",
        projectId: "av-clinica-convergencia",
        storageBucket: "av-clinica-convergencia.firebasestorage.app",
        messagingSenderId: "939404425675",
        appId: "1:939404425675:web:8cfae157099efabd741e4e"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    const questions = [
        { q: "Ante la reacción somática de M., ¿cuál es la prioridad técnica?", options: ["Interpretar el trauma infantil", "Co-regulación vincular", "Ignorar la somatización", "Instruir ejercicios de relajación"], correct: 1, feedback: "La co-regulación es fundamental: sin estabilización biológica, la palabra no alcanza la corteza prefrontal." },
        { q: "¿Por qué la transferencia es una oportunidad de re-cableado?", options: ["Borra recuerdos traumáticos", "Sustituye la personalidad", "Permite reparación neurobiológica vincular", "Elimina la necesidad de medicación"], correct: 2, feedback: "El vínculo actual permite modificar los esquemas de estrés grabados en los receptores del eje HPA." },
        { q: "¿Qué sucede con la corteza prefrontal ante cortisol elevado?", options: ["Se potencia su función", "Se dificulta su acceso funcional", "Se vuelve analítica pura", "No presenta cambios"], correct: 1, feedback: "El cortisol elevado compromete las funciones ejecutivas, requiriendo modulación alostática previa." },
        { q: "¿En qué consiste la 'Interpretación en dos tiempos'?", options: ["Dos sesiones distintas", "Estabilización somática y luego puente analítico", "Dos terapeutas a la vez", "Interpretación y luego silencio"], correct: 1, feedback: "Primero modulamos la respuesta biológica, luego habilitamos el insight analítico." },
        { q: "¿Qué rol cumple la contratransferencia somática?", options: ["Es un estorbo clínico", "Es un sensor del estado alostático del paciente", "Debe ser reprimida", "Carece de valor diagnóstico"], correct: 1, feedback: "El cuerpo del terapeuta actúa como un sismógrafo de la intersubjetividad en juego." }
    ];

    let current = 0;
    let score = 0;

    function render() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = `<p>${questions[current].q}</p>` + questions[current].options.map((opt, i) => 
            `<div class="option" onclick="check(${i})">${opt}</div>`).join('');
    }

    function check(idx) {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        
        if(idx === questions[current].correct) {
            score += 2;
            fb.className = 'correct';
            fb.innerHTML = "¡CORRECTO! " + questions[current].feedback;
        } else {
            fb.className = 'incorrect';
            fb.innerHTML = "INCORRECTO. " + questions[current].feedback;
        }
        
        document.querySelectorAll('.option').forEach(el => el.style.pointerEvents = 'none');
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        current++;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        if(current < questions.length) {
            render();
        } else {
            document.getElementById('app').innerHTML = `
                <div id="results-card" style="text-align:center; padding:20px;">
                    <h1>Resultado Final</h1>
                    <p style="font-size: 24px;">Puntaje: <span id="final-score">${score}/10</span></p>
                    
                    <div id="identificacion-card" style="border: 2px solid #D4AF37; padding: 20px; text-align: center; margin: 20px auto; max-width: 400px; background-color: #050508;">
                        <h3 style="margin-top: 0; color: #D4AF37;">Identificación</h3>
                        <input type="text" id="input-nombre" placeholder="APELLIDO Nombre (Ej: PEREZ Juan)" required style="padding: 10px; width: 90%; background: #000; color: #00ffff; border: 1px solid #00ffff; border-radius: 4px; text-align: center;">
                    </div>

                    <button onclick="mostrarResultadosFinales()" style="padding: 10px 20px; background: #00ffff; color: #000; border: none; cursor: pointer; font-weight: bold; font-family: 'Courier New', Courier, monospace;">Finalizar y Guardar</button>
                    <div id="final-dictamen" style="margin-top: 20px;"></div>
                </div>
            `;
        }
    }

    function mostrarResultadosFinales() {
        const nombreIngresado = document.getElementById('input-nombre').value.trim();
        const formatoValido = /^[A-ZÁÉÍÓÚÑ]+ [A-Za-zÁÉÍÓÚÑ\s]+$/;
        const dictamenBox = document.getElementById('final-dictamen');
        
        if (!formatoValido.test(nombreIngresado)) {
            alert("Error: Debe ingresar APELLIDO Nombre (Ejemplo: PEREZ Juan).");
            return;
        }

        let dictamen = `<p><strong>Dictamen:</strong> ${score >= 7 ? "Idoneidad Clínica Convalidada." : "Revisión Técnica Prescripta."}</p>`;
        dictamenBox.innerHTML = dictamen;

        // Guardado en la colección 'resultados_talleres' con visibilidad en false
        db.collection("resultados_talleres").add({
            alumno: nombreIngresado,
            taller_numero: "Taller 1",
            nota: `${score}/10`,
            fecha: new Date().toISOString(),
            visibleParaAlumno: false
        })
        .then(() => {
            dictamenBox.innerHTML += `<p style="color: #00FF88; margin-top: 15px;">✓ Resultados guardados exitosamente.</p>`;
        })
        .catch((error) => {
            console.error("Error al guardar:", error);
            dictamenBox.innerHTML += `<p style="color: #FF0000; margin-top: 15px;">X Error al guardar en Firebase.</p>`;
        });
    }

    render();
</script>
</body>
</html>
